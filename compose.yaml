services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thread
      POSTGRES_PASSWORD: thread
      POSTGRES_DB: thread
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - thread_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thread -d thread"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  thread_data:
