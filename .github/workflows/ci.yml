name: THREAD CI

on:
  push:
    branches: ['main', 'task/DEV-*']
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name == 'push' || github.repository == 'okuda1506/devquest-fashion-template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thread
          POSTGRES_PASSWORD: thread
          POSTGRES_DB: thread
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U thread -d thread"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://thread:thread@127.0.0.1:5432/thread
      THREAD_JWT_SECRET: ci-disposable-thread-secret-not-for-production
    steps:
      - name: 提出コミットを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js をセットアップ
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: インストールと DB 初期化
        run: |
          npm ci
          npm run db:generate
          npm run db:migrate
          npm run db:seed
      - name: 型・Lint・既存機能を検証
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
